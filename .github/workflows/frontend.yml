name: Frontend

# Called by deploy.yml, which owns the trigger, the path filter and the ordering.
# Never triggered on push.
#
# The locale redirect that used to run as a CloudFront Function is gone: /, /en
# and /pt-BR are plain exported routes and the language is chosen in the browser
# by react-i18next. See D3 in the migration plan.
#
# NEXT_PUBLIC_WS_URL is set explicitly per environment. It used to be unset so
# useWalletRealtime derived wss:// from NEXT_PUBLIC_API_URL at runtime — which
# leaves no wss:// literal in the build environment for the reusable workflow's
# connect-src generator to find. connect-src is scheme-exact, so the socket
# would have been blocked on every page the moment DNS moved.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    uses: artur-oliveira/ctech-cdk/.github/workflows/frontend-cloudflare.yml@main
    secrets: inherit
    with:
      service: ctech-wallet
      build-env-dev: |
        NEXT_PUBLIC_API_URL=https://wallet-dev-api.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://wallet-dev-api.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-dev-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=wallet
      build-env-stage: |
        NEXT_PUBLIC_API_URL=https://wallet-stage-api.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://wallet-stage-api.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-stage-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=wallet
      build-env-prod: |
        NEXT_PUBLIC_API_URL=https://wallet-api.aoctech.app
        NEXT_PUBLIC_WS_URL=wss://wallet-api.aoctech.app
        NEXT_PUBLIC_CTECH_URL=https://accounts-api.aoctech.app
        NEXT_PUBLIC_CTECH_CLIENT_ID=wallet
